<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">游戏用语为何血洗中文互联网</title>
  <desc id="desc">霓虹游戏界面、弹幕和中文互联网词汇组成的原创封面图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09091f"/>
      <stop offset="0.45" stop-color="#151052"/>
      <stop offset="1" stop-color="#021f33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d5fef" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#03d5ff" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <path d="M0 190H1600M0 320H1600M0 450H1600M0 580H1600M0 710H1600"/>
    <path d="M180 0V900M360 0V900M540 0V900M720 0V900M900 0V900M1080 0V900M1260 0V900M1440 0V900"/>
  </g>
  <circle cx="1320" cy="150" r="190" fill="#ff2da8" opacity="0.22" filter="url(#glow)"/>
  <circle cx="260" cy="760" r="240" fill="#00e0ff" opacity="0.2" filter="url(#glow)"/>
  <g transform="translate(225 210)">
    <rect x="0" y="0" width="1150" height="500" rx="44" fill="#07091b" stroke="#45f2ff" stroke-width="4" opacity="0.92"/>
    <rect x="42" y="42" width="1066" height="416" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <g fill="none" stroke-linecap="round" stroke-width="18" filter="url(#glow)">
      <path d="M255 225h210" stroke="#00e6ff"/>
      <path d="M360 120v210" stroke="#00e6ff"/>
      <path d="M742 154c76 0 137 58 137 129s-61 129-137 129-137-58-137-129 61-129 137-129z" stroke="#ff4fd8"/>
      <path d="M965 170l100 100-100 100" stroke="#ffe14d"/>
    </g>
    <g font-family="Inter, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-weight="800" letter-spacing="4" text-anchor="middle">
      <text x="575" y="535" fill="#ffffff" font-size="80">对线 · 破防 · 叠甲</text>
    </g>
  </g>
  <g font-family="Inter, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-weight="700" opacity="0.88">
    <text x="118" y="124" fill="#7df9ff" font-size="44">0帧起手</text>
    <text x="1128" y="742" fill="#ff82d8" font-size="42">带节奏</text>
    <text x="1010" y="116" fill="#f7f4a6" font-size="36">斩杀线</text>
    <text x="190" y="830" fill="#ffffff" fill-opacity="0.7" font-size="34">中文互联网语言演化</text>
  </g>
</svg>
