<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">什么是 SDD 规格驱动开发</title>
  <desc id="desc">规格文档、流程箭头和代码块组成的原创封面图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12372a"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#8ee9c6" stroke-width="2">
    <path d="M120 170h1360M120 450h1360M120 730h1360"/>
    <path d="M300 70v760M800 70v760M1300 70v760"/>
  </g>
  <g transform="translate(190 165)" filter="url(#shadow)">
    <rect width="430" height="570" rx="34" fill="url(#doc)"/>
    <rect x="58" y="64" width="190" height="24" rx="12" fill="#0f766e"/>
    <rect x="58" y="128" width="315" height="16" rx="8" fill="#94a3b8"/>
    <rect x="58" y="176" width="285" height="16" rx="8" fill="#94a3b8"/>
    <rect x="58" y="224" width="320" height="16" rx="8" fill="#94a3b8"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-weight="800" font-size="42" fill="#134e4a">
      <text x="58" y="350">Given</text>
      <text x="58" y="420">When</text>
      <text x="58" y="490">Then</text>
    </g>
  </g>
  <g transform="translate(980 210)" filter="url(#shadow)">
    <rect width="430" height="480" rx="34" fill="#07111f" stroke="#34d399" stroke-opacity="0.55"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="32" fill="#a7f3d0">
      <text x="52" y="100">function build()</text>
      <text x="52" y="165">  spec → code</text>
      <text x="52" y="230">  review()</text>
      <text x="52" y="295">  iterate()</text>
      <text x="52" y="360">return product</text>
    </g>
  </g>
  <g fill="none" stroke="#fde68a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M660 450h260"/>
    <path d="M920 450l-70-52m70 52-70 52"/>
  </g>
  <g font-family="Inter, 'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">
    <text x="800" y="115" fill="#ffffff" font-size="74" font-weight="900">Spec-Driven Development</text>
    <text x="800" y="810" fill="#a7f3d0" font-size="48" font-weight="800">先把需求写清楚，再让 AI 动手</text>
  </g>
</svg>
