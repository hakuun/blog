<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">为什么 AI 这么爱说不是而是</title>
  <desc id="desc">对称文本模板、AI 光点和标准答案感组成的原创封面图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131f"/>
      <stop offset="0.5" stop-color="#1f2540"/>
      <stop offset="1" stop-color="#0b3a46"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#d8f7ff" stroke-width="2">
    <path d="M210 120h1180M210 780h1180M260 80v740M1340 80v740"/>
    <path d="M360 260h880M360 450h880M360 640h880" stroke-dasharray="16 18"/>
  </g>
  <g transform="translate(310 175)">
    <rect width="980" height="550" rx="42" fill="url(#panel)" stroke="#b9f3ff" stroke-opacity="0.42"/>
    <g font-family="Inter, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-weight="900" text-anchor="middle">
      <text x="490" y="205" fill="#ffffff" font-size="116">不是 A</text>
      <text x="490" y="360" fill="#8ff3ff" font-size="116">而是 B</text>
      <text x="490" y="475" fill="#ffffff" fill-opacity="0.58" font-size="42">标准答案的完美形状</text>
    </g>
    <path d="M245 260h490" stroke="#facc15" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M735 260l-56-36m56 36-56 36" stroke="#facc15" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <g fill="#9df7ff" filter="url(#glow)">
    <circle cx="230" cy="185" r="10"/>
    <circle cx="1346" cy="226" r="8"/>
    <circle cx="207" cy="690" r="7"/>
    <circle cx="1390" cy="705" r="11"/>
    <circle cx="800" cy="80" r="9"/>
  </g>
  <g font-family="Inter, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-weight="700" font-size="32" fill="#ffffff" fill-opacity="0.55">
    <text x="120" y="392">安全</text>
    <text x="1320" y="392">圆滑</text>
    <text x="132" y="520">完整</text>
    <text x="1308" y="520">升华</text>
  </g>
</svg>
